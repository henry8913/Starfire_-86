name: Deploy Starfire '86

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 158.180.235.83
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/Starfire_-86
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            sudo docker compose up -d
            echo "Deploy completato: $(git rev-parse --short HEAD) - $(date -u +%FT%TZ)"
