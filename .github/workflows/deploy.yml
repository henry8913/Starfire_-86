name: Deploy Starfire '86

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 158.180.235.83
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/Starfire_-86
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            # Cache-busting: aggiunge ?v=<commit> a css/js/immagine, cosi' browser e Cloudflare
            # scaricano SEMPRE la versione nuova ad ogni deploy.
            V=$(git rev-parse --short HEAD)
            # (dopo git reset l'HTML e' sempre pulito, quindi basta aggiungere il ?v=)
            sed -i "s#href=\"style.css\"#href=\"style.css?v=$V\"#; s#src=\"script.js\"#src=\"script.js?v=$V\"#; s#IMG/tag.jpg\"#IMG/tag.jpg?v=$V\"#g" index.html
            # Ricrea il container da zero (rimette online la versione nuova)
            sudo docker compose up -d --force-recreate --remove-orphans
            echo "Deploy completato: $V - $(date -u +%FT%TZ)"
